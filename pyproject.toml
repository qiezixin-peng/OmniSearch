[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "omnisearch-engine"
version = "0.1.0"
description = "Multilingual, multi-source, dual-channel research search engine"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "OmniSearch Team" }]
dependencies = [
  "alembic>=1.14,<2",
  "boto3>=1.35,<2",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "mcp>=2,<3",
  "opentelemetry-exporter-otlp-proto-http>=1.30,<2",
  "opentelemetry-instrumentation-fastapi>=0.51b0,<1",
  "opentelemetry-sdk>=1.30,<2",
  "pymupdf>=1.26,<2",
  "psycopg[binary]>=3.2,<4",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "selectolax>=0.3,<1",
  "sqlalchemy>=2.0,<3",
  "structlog>=25,<26",
  "trafilatura>=2.0,<3",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
browser = [
  "PySocks>=1.7,<2",
  "patchright>=1.64.4,<1.65",
  "scrapling[rag]>=0.5.1,<0.6",
]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<1",
  "ruff>=0.9,<1",
]

[project.scripts]
omnisearch-api = "omnisearch.apps.api.main:run"
omnisearch-mcp = "omnisearch.apps.mcp.server:run"
omnisearch-worker = "omnisearch.apps.worker:run"
omnisearch-migrate = "omnisearch.storage.migrate:run"
omnisearch = "omnisearch.apps.cli:run"

[tool.hatch.build.targets.wheel]
packages = ["src/omnisearch"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider"
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
